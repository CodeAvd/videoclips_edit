[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-shorts-engine-backend"
version = "0.1.0"
description = "FastAPI control plane for the AI Shorts Engine v1"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16.0,<2.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "fastapi>=0.116.0,<1.0.0",
  "greenlet>=3.2.0,<4.0.0",
  "httpx>=0.28.0,<1.0.0",
  "minio>=7.2.16,<8.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "sqlalchemy>=2.0.40,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0,<1.0.0",
  "pytest>=8.4.0,<9.0.0",
  "pytest-asyncio>=1.1.0,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "postgres: requires POSTGRES_TEST_DATABASE_URL pointing at a disposable Postgres database",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv]
package = true
